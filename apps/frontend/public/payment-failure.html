<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment not completed - ShopNepal</title>
  <meta name="description" content="The payment did not go through.">

  <link rel="shortcut icon" href="/assets/images/logo/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/assets/css/style-prefix.css">
  <link rel="stylesheet" href="/assets/css/shop.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>

  <header data-site-header></header>

  <main>
    <div class="container">
      <section class="pdp-empty receipt-failure">
        <ion-icon name="close-circle-outline"></ion-icon>
        <h1 class="pdp-title">Payment not completed</h1>
        <p data-failure-reason>Your payment didn't go through, so you have not been charged.</p>
        <div class="receipt-actions">
          <a href="/cart.html" class="btn-primary">Back to your bag</a>
          <a href="/" class="btn-ghost">Continue shopping</a>
        </div>
      </section>
    </div>
  </main>

  <footer data-site-footer></footer>

  <script src="/assets/js/products.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/failure.js"></script>

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
